<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 INMP441 Secure Live Audio</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 700px;
  margin: 40px auto;
  padding: 20px;
  background: #111;
  color: #eee;
}
button {
  font-size: 18px;
  padding: 12px 20px;
  margin: 5px 8px 5px 0;
  cursor: pointer;
}
button:disabled { opacity: 0.5; cursor: not-allowed; }
#status {
  margin: 20px 0;
  padding: 12px;
  background: #222;
  border-radius: 8px;
}
.control {
  margin: 25px 0;
  padding: 18px;
  background: #222;
  border-radius: 8px;
}
input[type="range"] { width: 100%; }
#meter {
  width: 100%;
  height: 24px;
  background: #333;
  border-radius: 12px;
  overflow: hidden;
}
#level {
  width: 0%;
  height: 100%;
  background: #4caf50;
  transition: width 0.05s;
}
#recordStatus {
  margin-top: 12px;
  font-weight: bold;
}
.small { color: #aaa; font-size: 14px; }
</style>
</head>

<body>

<h1>ESP32 INMP441 Live Audio</h1>

<div class="control"><strong>Listener PIN</strong><br><br><input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="32" placeholder="Enter listener PIN"></div>
<button id="start">Start Listening</button>
<button id="stop" disabled>Stop</button>

<div class="control">
  <strong>Recording</strong><br><br>

  <button id="record" disabled>🔴 Start Recording</button>
  <button id="stopRecord" disabled>⏹ Stop Recording</button>

  <div id="recordStatus">Not recording</div>
  <div id="duration">00:00</div>
</div>

<div id="status">Disconnected</div>

<div class="control">
  <strong>Browser Volume</strong><br><br>

  <input id="volume" type="range"
         min="0" max="3" step="0.01" value="1.5">

  <p>
    Volume:
    <span id="volumeValue">150%</span>
  </p>
</div>

<p>Audio level</p>

<div id="meter">
  <div id="level"></div>
</div>

<p class="small">
16 kHz mono PCM16 • Secure PIN • Multi-listener • WAV recording
</p>

<script>
const SAMPLE_RATE = 16000;
const CHANNELS = 1;
const BYTES_PER_SAMPLE = 2;
const TARGET_BUFFER_SECONDS = 0.12;

let ws = null;
let audioContext = null;
let gainNode = null;
let nextPlayTime = 0;

let recording = false;
let recordedChunks = [];
let recordedSamples = 0;
let recordStartTime = 0;
let timerHandle = null;

const status = document.getElementById("status");
const level = document.getElementById("level");
const start = document.getElementById("start");
const stop = document.getElementById("stop");

const record = document.getElementById("record");
const stopRecord = document.getElementById("stopRecord");
const recordStatus = document.getElementById("recordStatus");
const duration = document.getElementById("duration");

const volume = document.getElementById("volume");
const volumeValue = document.getElementById("volumeValue");
const pinInput = document.getElementById("pin");

function setStatus(text) {
  status.textContent = text;
}

function updateVolume() {
  const value = Number(volume.value);
  volumeValue.textContent = Math.round(value * 100) + "%";

  if (gainNode) {
    gainNode.gain.value = value;
  }
}

volume.addEventListener("input", updateVolume);

function updateDuration() {
  if (!recording) return;

  const seconds =
    Math.floor((Date.now() - recordStartTime) / 1000);

  const minutes =
    Math.floor(seconds / 60);

  const remaining =
    seconds % 60;

  duration.textContent =
    String(minutes).padStart(2, "0") + ":" +
    String(remaining).padStart(2, "0");

  timerHandle = setTimeout(updateDuration, 500);
}

function playPCM16(arrayBuffer) {
  if (!audioContext || !gainNode) return;

  if (arrayBuffer.byteLength === 0 ||
      arrayBuffer.byteLength % 2 !== 0) {
    return;
  }

  const input = new Int16Array(arrayBuffer);

  // Save the original PCM16 received from ESP32.
  // Recording is independent of browser volume.
  if (recording) {
    const copy = new Int16Array(input.length);
    copy.set(input);
    recordedChunks.push(copy);
    recordedSamples += input.length;
  }

  const buffer =
    audioContext.createBuffer(
      CHANNELS,
      input.length,
      SAMPLE_RATE
    );

  const output =
    buffer.getChannelData(0);

  let sum = 0;

  for (let i = 0; i < input.length; i++) {
    const value = input[i] / 32768.0;

    output[i] = value;

    sum += value * value;
  }

  const rms =
    Math.sqrt(sum / input.length);

  level.style.width =
    Math.min(100, rms * 220) + "%";

  const now =
    audioContext.currentTime;

  if (nextPlayTime < now + 0.03) {
    nextPlayTime =
      now + TARGET_BUFFER_SECONDS;
  }

  const source =
    audioContext.createBufferSource();

  source.buffer = buffer;
  source.connect(gainNode);
  source.start(nextPlayTime);

  nextPlayTime += buffer.duration;
}

function startRecording() {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    return;
  }

  recordedChunks = [];
  recordedSamples = 0;

  recording = true;
  recordStartTime = Date.now();

  record.disabled = true;
  stopRecord.disabled = false;

  recordStatus.textContent =
    "🔴 Recording...";

  duration.textContent = "00:00";

  updateDuration();
}

function stopRecording() {
  if (!recording) return;

  recording = false;

  if (timerHandle) {
    clearTimeout(timerHandle);
    timerHandle = null;
  }

  record.disabled = false;
  stopRecord.disabled = true;

  recordStatus.textContent =
    "Processing WAV...";

  const wavBlob =
    createWavBlob(recordedChunks, recordedSamples);

  const url =
    URL.createObjectURL(wavBlob);

  const link =
    document.createElement("a");

  const stamp =
    new Date()
      .toISOString()
      .replace(/[:.]/g, "-");

  link.href = url;
  link.download =
    "ESP32_INMP441_" + stamp + ".wav";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 1000);

  recordStatus.textContent =
    "Recording saved as WAV";
}

function createWavBlob(chunks, sampleCount) {
  const dataSize =
    sampleCount * BYTES_PER_SAMPLE;

  const buffer =
    new ArrayBuffer(44 + dataSize);

  const view =
    new DataView(buffer);

  function writeString(offset, text) {
    for (let i = 0; i < text.length; i++) {
      view.setUint8(
        offset + i,
        text.charCodeAt(i)
      );
    }
  }

  writeString(0, "RIFF");
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, "WAVE");

  writeString(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);              // PCM
  view.setUint16(22, CHANNELS, true);
  view.setUint32(24, SAMPLE_RATE, true);
  view.setUint32(
    28,
    SAMPLE_RATE * CHANNELS * BYTES_PER_SAMPLE,
    true
  );
  view.setUint16(
    32,
    CHANNELS * BYTES_PER_SAMPLE,
    true
  );
  view.setUint16(34, 16, true);

  writeString(36, "data");
  view.setUint32(40, dataSize, true);

  let offset = 44;

  for (const chunk of chunks) {
    for (let i = 0; i < chunk.length; i++) {
      view.setInt16(
        offset,
        chunk[i],
        true
      );

      offset += 2;
    }
  }

  return new Blob(
    [buffer],
    { type: "audio/wav" }
  );
}

start.onclick = async () => {
  try {
    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )({
        sampleRate: SAMPLE_RATE,
        latencyHint: "interactive"
      });

    gainNode =
      audioContext.createGain();

    gainNode.gain.value =
      Number(volume.value);

    gainNode.connect(
      audioContext.destination
    );

    await audioContext.resume();

    nextPlayTime =
      audioContext.currentTime +
      TARGET_BUFFER_SECONDS;

    const protocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    ws =
      new WebSocket(
        protocol +
        "//" +
        location.host +
        "/ws"
      );

    ws.binaryType =
      "arraybuffer";

    ws.onopen = () => {
      setStatus(
        "Connected — registering listener..."
      );

      const pin = pinInput.value.trim();
      if (!pin) {
        ws.close();
        setStatus("Listener PIN required");
        return;
      }

      ws.send(
        JSON.stringify({
          type: "listener",
          pin
        })
      );

      start.disabled = true;
      stop.disabled = false;
      record.disabled = false;
    };

    ws.onmessage = (event) => {
      if (typeof event.data === "string") {
        try {
          const message =
            JSON.parse(event.data);

          if (message.type === "auth_failed") {
            setStatus("Access denied — incorrect PIN");
            return;
          }

          if (message.type === "listener_ready") {
            setStatus(
              "Listening — " +
              message.sample_rate +
              " Hz " +
              message.format
            );
          }
        } catch {
          setStatus(event.data);
        }

        return;
      }

      playPCM16(event.data);
    };

    ws.onerror = () => {
      setStatus("WebSocket error");
    };

    ws.onclose = () => {
      if (recording) {
        stopRecording();
      }

      setStatus("Disconnected");

      start.disabled = false;
      stop.disabled = true;
      record.disabled = true;
      stopRecord.disabled = true;
    };

  } catch (error) {
    console.error(error);
    setStatus(
      "Audio initialization failed"
    );
  }
};

stop.onclick = () => {
  if (recording) {
    stopRecording();
  }

  if (ws) {
    if (ws.readyState === WebSocket.OPEN) {
      try { ws.send(JSON.stringify({ type: "listener_stop" })); } catch {}
    }
    ws.close();
    ws = null;
  }

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  gainNode = null;
  nextPlayTime = 0;

  level.style.width = "0%";

  setStatus("Stopped");

  start.disabled = false;
  stop.disabled = true;
  record.disabled = true;
  stopRecord.disabled = true;
};

record.onclick = startRecording;
stopRecord.onclick = stopRecording;

updateVolume();
</script>

</body>
</html>
