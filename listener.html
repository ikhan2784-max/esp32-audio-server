<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 ICS43434 Live Audio</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 700px;
  margin: 40px auto;
  padding: 20px;
  background: #111;
  color: #eee;
}

button {
  font-size: 18px;
  padding: 12px 20px;
  margin-right: 10px;
  cursor: pointer;
}

#status {
  margin: 20px 0;
  padding: 12px;
  background: #222;
  border-radius: 8px;
}

.control {
  margin: 25px 0;
  padding: 18px;
  background: #222;
  border-radius: 8px;
}

input[type="range"] {
  width: 100%;
}

#meter {
  width: 100%;
  height: 24px;
  background: #333;
  border-radius: 12px;
  overflow: hidden;
}

#level {
  width: 0%;
  height: 100%;
  background: #4caf50;
  transition: width 0.05s;
}

.small {
  color: #aaa;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>ESP32 ICS43434 Live Audio</h1>

<button id="start">Start Listening</button>
<button id="stop" disabled>Stop</button>

<div id="status">Disconnected</div>

<div class="control">
  <strong>Browser Volume</strong>
  <br><br>

  <input
    id="volume"
    type="range"
    min="0"
    max="3"
    step="0.01"
    value="1.5"
  >

  <p>
    Volume:
    <span id="volumeValue">150%</span>
  </p>
</div>

<p>Audio level</p>

<div id="meter">
  <div id="level"></div>
</div>

<p class="small">
  16 kHz mono PCM16 • Continuous queued playback
</p>

<script>
const SAMPLE_RATE = 16000;

// Keep a small amount of audio queued.
// Too little can cause gaps; too much increases latency.
const TARGET_BUFFER_SECONDS = 0.12;

let ws = null;
let audioContext = null;
let gainNode = null;
let nextPlayTime = 0;
let queuedSeconds = 0;

const status = document.getElementById("status");
const level = document.getElementById("level");
const start = document.getElementById("start");
const stop = document.getElementById("stop");
const volume = document.getElementById("volume");
const volumeValue = document.getElementById("volumeValue");

function setStatus(text) {
  status.textContent = text;
}

function updateVolume() {
  const value = Number(volume.value);

  volumeValue.textContent =
    Math.round(value * 100) + "%";

  if (gainNode) {
    gainNode.gain.value = value;
  }
}

volume.addEventListener("input", updateVolume);

function playPCM16(arrayBuffer) {
  if (!audioContext || !gainNode) {
    return;
  }

  if (arrayBuffer.byteLength === 0 ||
      arrayBuffer.byteLength % 2 !== 0) {
    return;
  }

  const input = new Int16Array(arrayBuffer);

  const buffer =
    audioContext.createBuffer(
      1,
      input.length,
      SAMPLE_RATE
    );

  const output =
    buffer.getChannelData(0);

  let sum = 0;
  let peak = 0;

  for (let i = 0; i < input.length; i++) {
    const value = input[i] / 32768.0;

    output[i] = value;

    const abs = Math.abs(value);

    sum += value * value;

    if (abs > peak) {
      peak = abs;
    }
  }

  const rms =
    Math.sqrt(sum / input.length);

  // Display level without changing the actual audio.
  level.style.width =
    Math.min(100, rms * 220) + "%";

  const now =
    audioContext.currentTime;

  // If playback has fallen behind, restart with
  // a small safety buffer.
  if (nextPlayTime < now + 0.03) {
    nextPlayTime =
      now + TARGET_BUFFER_SECONDS;
  }

  const source =
    audioContext.createBufferSource();

  source.buffer = buffer;
  source.connect(gainNode);

  source.start(nextPlayTime);

  nextPlayTime += buffer.duration;

  queuedSeconds =
    Math.max(0, nextPlayTime - now);
}

start.onclick = async () => {
  try {
    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )({
        sampleRate: SAMPLE_RATE,
        latencyHint: "interactive"
      });

    gainNode =
      audioContext.createGain();

    gainNode.gain.value =
      Number(volume.value);

    gainNode.connect(
      audioContext.destination
    );

    await audioContext.resume();

    nextPlayTime =
      audioContext.currentTime +
      TARGET_BUFFER_SECONDS;

    const protocol =
      location.protocol === "https:"
        ? "wss:"
        : "ws:";

    ws =
      new WebSocket(
        protocol +
        "//" +
        location.host +
        "/ws"
      );

    ws.binaryType =
      "arraybuffer";

    ws.onopen = () => {
      setStatus(
        "Connected — registering listener..."
      );

      ws.send(
        JSON.stringify({
          type: "listener"
        })
      );

      start.disabled = true;
      stop.disabled = false;
    };

    ws.onmessage = (event) => {
      if (typeof event.data === "string") {
        try {
          const message =
            JSON.parse(event.data);

          if (
            message.type ===
            "listener_ready"
          ) {
            setStatus(
              "Listening — " +
              message.sample_rate +
              " Hz " +
              message.format
            );
          }
        } catch {
          setStatus(event.data);
        }

        return;
      }

      playPCM16(event.data);
    };

    ws.onerror = () => {
      setStatus("WebSocket error");
    };

    ws.onclose = () => {
      setStatus("Disconnected");

      start.disabled = false;
      stop.disabled = true;
    };

  } catch (error) {
    console.error(error);
    setStatus(
      "Audio initialization failed"
    );
  }
};

stop.onclick = () => {
  if (ws) {
    ws.close();
    ws = null;
  }

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  gainNode = null;
  nextPlayTime = 0;
  queuedSeconds = 0;

  level.style.width = "0%";

  setStatus("Stopped");

  start.disabled = false;
  stop.disabled = true;
};
</script>

</body>
</html>
